site_name: 学习笔记知识库

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: teal
  features:
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
